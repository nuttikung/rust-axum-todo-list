[package]
name = "rust-axum-todo-list"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.97"
async-trait = "0.1.87"
axum = "0.8.1"
chrono = { version = "0.4.40", features = ["serde"] }
config = "0.15.8"
mockall = "0.13.1"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.140"
sqlx = { version = "0.8.3", features = ["runtime-tokio", "postgres", "chrono", "uuid", "tls-native-tls", "macros"] }
thiserror = "2.0.12"
tokio = { version = "1", features = ["full"] }
tower = "0.5.2"
tower-http = { version = "0.6.2", features = ["compression-full", "decompression-full", "cors", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

[workspace.metadata.scripts]
start_dev = "cargo watch -q -c -w src/ -x run"
