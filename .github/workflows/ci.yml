name: Deploy To Cloud

on:
  push:
    branches:
      - main

env:
  CI: true
  CARGO_TERM_COLOR: always

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: PROD
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "set-up env"
        run: |
          touch Setting.toml
          echo [server] >> Setting.toml
          echo port = ${{ vars.APP_PORT }} >> Setting.toml
          echo [database] >> Setting.toml
          echo host = ${{ secrets.DB_HOST }} >> Setting.toml
          echo user = ${{ secrets.DB_USER }} >> Setting.toml
          echo password = ${{ secrets.DB_PASSWORD }} >> Setting.toml
          echo dbname = ${{ secrets.DB_DBNAME }} >> Setting.toml
          echo schema = ${{ secrets.DB_SCHEMA }} >> Setting.toml

      - name: install the gcloud cli
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GOOGLE_PROJECT }}
          workload_identity_provider: ${{ secrets.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account_key: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          export_default_credentials: true

      - name: build and push the docker image
        env:
          GOOGLE_PROJECT: ${{ secrets.GOOGLE_PROJECT }}
        run: |
          gcloud auth configure-docker asia-southeast1-docker.pkg.dev
          docker build -t asia-southeast1-docker.pkg.dev/$GOOGLE_PROJECT/rust-axum-todo-list:latest .
          docker push asia-southeast1-docker.pkg.dev/$GOOGLE_PROJECT/rust-axum-todo-list:latest
