name: Deploy To Cloud

on:
  push:
    branches:
      - develop

env:
  CI: true
  CARGO_TERM_COLOR: always

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: PROD
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: "set-up env"
        run: |
          cat << EOF > Setting.toml
              [server]
              port = ${{ vars.APP_PORT }}

              [database]
              host = ${{ secrets.DB_HOST }}
              user = ${{ secrets.DB_USER }}
              password = ${{ secrets.DB_PASSWORD }}
              dbname = ${{ secrets.DB_DBNAME }}
              schema = ${{ secrets.DB_SCHEMA }}
            EOF

      - name: Google Cloud Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"
          # project_id: "${{ secrets.GOOGLE_PROJECT_ID }}"

      - name: Set up Cloud SDK
        uses: "google-github-actions/setup-gcloud@v2"

      - name: Configure Docker
        run: |
          gcloud auth configure-docker ${{ secrets.GCP_LOCATION}}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.GCP_LOCATION }}-docker.pkg.dev/${{ secrets.GOOGLE_PROJECT_ID }}/rust-web-api/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # - uses: 'google-github-actions/deploy-cloudrun@v2'
      #   with:
      #     image: ${{ secrets.GCP_LOCATION }}-docker.pkg.dev/${{ secrets.GOOGLE_PROJECT_ID }}/rust-web-api/api:latest
      #     service: 'hello-cloud-run'
