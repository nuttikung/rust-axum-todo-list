name: Cargo Build & Test

on:
  # push:
  pull_request:

env:
  CI: true
  CARGO_TERM_COLOR: always

jobs:
  set_env:
    runs-on: ubuntu-latest
    name: "Create Setting.toml file"
    environment: PROD
    steps:
      - run: |
          touch Setting.toml
          echo [server] >> Setting.toml
          echo port = ${{ vars.APP_PORT }} >> Setting.toml
          echo [database] >> Setting.toml
          # echo host = ${{ secrets.DB_HOST }} >> Setting.toml
          cat Setting.toml

